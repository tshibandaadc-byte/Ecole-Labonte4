name: Tests du référentiel scolaire
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  school-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester les niveaux et classes
        run: python -m unittest discover -s tests -v
