name: École Shemec CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  flask-smoke-test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret
      ADMIN_PASSWORD: CI-Shemec-Password-2026
      DATABASE_URL: sqlite:///ci-test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py
      - name: Test login and admin dashboard
        run: |
          python - <<'PY'
          import os
          import app as shemec
          client = shemec.app.test_client()
          response = client.get("/connexion")
          assert response.status_code == 200, response.status_code
          response = client.post("/connexion", data={
              "identifier": "admin@shemec.cd",
              "password": os.environ["ADMIN_PASSWORD"]
          }, follow_redirects=True)
          assert response.status_code == 200, response.status_code
          assert "École Shemec" in response.get_data(as_text=True)
          assert "Élèves inscrits" in response.get_data(as_text=True)
          for path in ["/annees-scolaires", "/bibliotheque", "/transport", "/cantine", "/comptabilite", "/journal"]:
              check = client.get(path)
              assert check.status_code == 200, (path, check.status_code)
          public = client.get("/accueil")
          assert public.status_code == 200
          print("École Shemec Flask smoke test passed.")
          PY
