services:
  - type: web
    name: ecole-shemec
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ecole-shemec-db
          property: connectionString
databases:
  - name: ecole-shemec-db
    plan: free
